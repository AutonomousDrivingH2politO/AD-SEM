<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Animator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin:0; height:100%; font-family:Consolas,Menlo,monospace; }
  #map { position:absolute; inset:0; background:#111; }

  #panel {
    position:fixed; bottom:16px; right:16px; z-index:1000;
    width:34vw; min-width:320px; max-width:540px;
    background:rgba(10,13,20,0.42); color:#f2f5fb; font-size:19px; line-height:1.75;
    padding:22px 26px; border-radius:16px; border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    text-shadow:0 1px 2px rgba(0,0,0,0.65);
  }
  #panel h3 { margin:0 0 14px; font-size:26px; color:#fff; letter-spacing:.5px; }
  .pr { display:flex; justify-content:space-between; gap:14px; padding:2px 0; }
  .pr span:first-child { color:#aeb8cc; }
  .pr span:last-child { font-weight:600; }
  #legend { margin-top:16px; }
  #legbar { height:14px; border-radius:7px;
    background:linear-gradient(to right,#00ff00,#ffff00,#ff0000); }
  #leglabels { display:flex; justify-content:space-between; color:#aeb8cc; font-size:14px; }

  #controls {
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:1000;
    background:rgba(15,18,25,0.9); color:#eaeef5; padding:10px 14px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.15); box-shadow:0 4px 18px rgba(0,0,0,0.45);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; max-width:92vw;
  }
  #controls button {
    background:#2b6cff; color:#fff; border:0; border-radius:8px; padding:7px 12px;
    font-family:inherit; font-size:13px; cursor:pointer;
  }
  #controls button:hover { background:#1f57d6; }
  #controls label { font-size:12px; color:#cdd5e3; }
  #fileLabel {
    background:#3a4256; padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  #fileLabel:hover { background:#4a5066; }
  input[type=file] { display:none; }
  input[type=range] { width:120px; vertical-align:middle; }
  #hint { color:#9aa6bd; font-size:12px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h3>LIVE POSITION</h3>
  <div id="panelBody"><div class="pr"><span>Status</span><span>Waiting for CSV</span></div></div>
  <div id="legend" style="display:none">
    <div id="legbar"></div>
    <div id="leglabels"><span id="legmin">0</span><span>km/h</span><span id="legmax">0</span></div>
  </div>
</div>

<div id="controls">
  <label id="fileLabel" for="fileInput">📂 Load CSV</label>
  <input id="fileInput" type="file" accept=".csv,.txt">
  <button id="playBtn" disabled>▶ Play</button>
  <button id="restartBtn" disabled>⟲ Restart</button>
  <label>Speed <input id="speed" type="range" min="1" max="100" value="40"></label>
  <span id="hint">Load a CSV (lat, lon, stamp_sec columns)</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- Map ----------
var map = L.map('map', { zoomControl:true }).setView([45.07, 7.69], 5);
var sat = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution:'Tiles &copy; Esri', maxZoom:21 }).addTo(map);
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution:'&copy; OpenStreetMap', maxZoom:19 });
L.control.layers({ 'Satellite':sat, 'Street':osm }, null, { position:'bottomleft' }).addTo(map);

// ---------- Helpers ----------
function haversine(a, b){
  var R=6371000, p1=a.lat*Math.PI/180, p2=b.lat*Math.PI/180;
  var dphi=(b.lat-a.lat)*Math.PI/180, dl=(b.lon-a.lon)*Math.PI/180;
  var x=Math.sin(dphi/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function speedColor(v, vmax){
  var r = vmax>0 ? Math.max(0,Math.min(1, v/vmax)) : 0;
  var hue = 120*(1-r), h=hue/60, x=1-Math.abs(h%2-1), R,G,B;
  if(h<1){R=1;G=x;B=0;} else if(h<2){R=x;G=1;B=0;} else if(h<3){R=0;G=1;B=x;}
  else if(h<4){R=0;G=x;B=1;} else {R=x;G=0;B=1;}
  function hx(n){return ('0'+Math.round(n*255).toString(16)).slice(-2);}
  return '#'+hx(R)+hx(G)+hx(B);
}
function parseCSV(text){
  var lines = text.replace(/\r/g,'').split('\n').filter(function(l){return l.length;});
  if(!lines.length) return {header:[],rows:[]};
  var header = lines[0].split(',').map(function(h){return h.trim();});
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var c=lines[i].split(','), o={};
    for(var j=0;j<header.length;j++) o[header[j]]=(c[j]||'').trim();
    rows.push(o);
  }
  return {header:header, rows:rows};
}
function findCol(header, cands){
  var low={}; header.forEach(function(h){ low[h.toLowerCase()]=h; });
  for(var i=0;i<cands.length;i++) if(low[cands[i]]) return low[cands[i]];
  return null;
}
function clk(ms){
  var d=new Date(ms); function p(n){return (n<10?'0':'')+n;}
  return p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());
}

// ---------- State ----------
var pts=[], vmax=1, segLayer=L.layerGroup().addTo(map), head=null;
var idx=0, timer=null, playing=false;
var hasHacc=false, hasStat=false, hasReason=false, hasTime=false, hasAlt=false;

function row(label,val){
  return '<div class="pr"><span>'+label+'</span><span>'+val+'</span></div>';
}
function updatePanel(i){
  if(!pts.length) return;
  var p=pts[Math.max(0,Math.min(i,pts.length-1))];
  var h='';
  if(hasTime) h+=row('Time (UTC)', clk(p.t*1000));
  h+=row('Latitude', p.lat.toFixed(7));
  h+=row('Longitude', p.lon.toFixed(7));
  if(hasAlt && p.alt!=null) h+=row('Altitude', p.alt.toFixed(2)+' m');
  h+=row('Speed', (p.v*3.6).toFixed(2)+' km/h');
  if(hasHacc && p.hacc!=null) h+=row('Accuracy', (p.hacc*100).toFixed(1)+' cm');
  if(hasStat && p.stat) h+=row('Status', p.stat);
  if(hasReason && p.reason) h+=row('Reason', p.reason);
  h+=row('Point', (i+1)+' / '+pts.length);
  document.getElementById('panelBody').innerHTML=h;
}

function clearTrack(){
  segLayer.clearLayers();
  if(head){ map.removeLayer(head); head=null; }
  idx=0;
}

function drawStep(){
  if(idx>=pts.length){ stop(); return; }
  if(idx>0){
    var a=pts[idx-1], b=pts[idx];
    L.polyline([[a.lat,a.lon],[b.lat,b.lon]],
      {color:speedColor(b.v,vmax), weight:5, opacity:1}).addTo(segLayer);
  }
  var cur=pts[idx];
  if(!head){
    head=L.circleMarker([cur.lat,cur.lon],
      {radius:6, color:'#fff', weight:2, fillColor:'#2b6cff', fillOpacity:1}).addTo(map);
  } else { head.setLatLng([cur.lat,cur.lon]); }
  updatePanel(idx);
  idx++;
}

function tickDelay(){ // slider 1..100 -> delay 200..2 ms
  var s=+document.getElementById('speed').value;
  return Math.max(2, 202 - s*2);
}
function play(){
  if(!pts.length) return;
  if(idx>=pts.length) clearTrack();
  playing=true;
  document.getElementById('playBtn').textContent='⏸ Pause';
  function loop(){
    if(!playing) return;
    drawStep();
    timer=setTimeout(loop, tickDelay());
  }
  loop();
}
function stop(){
  playing=false;
  if(timer){ clearTimeout(timer); timer=null; }
  document.getElementById('playBtn').textContent='▶ Play';
}

document.getElementById('playBtn').onclick=function(){ playing?stop():play(); };
document.getElementById('restartBtn').onclick=function(){ stop(); clearTrack(); updatePanel(0); };

document.getElementById('fileInput').onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    loadData(rd.result, f.name);
  };
  rd.readAsText(f);
};

function loadData(text, name){
  var parsed=parseCSV(text);
  var H=parsed.header;
  var cLat=findCol(H,['lat','latitude']);
  var cLon=findCol(H,['lon','longitude','lng']);
  var cT=findCol(H,['stamp_sec','utc_seconds','time','timestamp']);
  var cAlt=findCol(H,['alt','altitude','altitude_m']);
  var cHa=findCol(H,['h_acc','hacc','horiz_acc']);
  var cSt=findCol(H,['status','fix']);
  var cRe=findCol(H,['reason']);
  if(!cLat||!cLon){ alert('lat and lon columns not found in CSV.'); return; }

  pts=[];
  parsed.rows.forEach(function(r,i){
    var lat=parseFloat(r[cLat]), lon=parseFloat(r[cLon]);
    if(isNaN(lat)||isNaN(lon)) return;
    var t = cT && r[cT]!=='' ? parseFloat(r[cT]) : i;
    if(isNaN(t)) t=i;
    var o={t:t, lat:lat, lon:lon, v:0};
    o.alt = (cAlt && r[cAlt]!=='') ? parseFloat(r[cAlt]) : null;
    o.hacc = (cHa && r[cHa]!=='') ? parseFloat(r[cHa]) : null;
    o.stat = cSt ? r[cSt] : null;
    o.reason = cRe ? r[cRe] : null;
    pts.push(o);
  });
  if(pts.length<2){ alert('Not enough valid points.'); return; }

  hasTime=!!cT; hasAlt=!!cAlt; hasHacc=!!cHa; hasStat=!!cSt; hasReason=!!cRe;

  // speeds
  vmax=0;
  for(var i=1;i<pts.length;i++){
    var d=haversine(pts[i-1],pts[i]);
    var dt=pts[i].t-pts[i-1].t; if(dt<=0) dt=1;
    pts[i].v=d/dt;
    if(pts[i].v>vmax) vmax=pts[i].v;
  }
  if(vmax<=0) vmax=1;

  // legend
  document.getElementById('legend').style.display='block';
  document.getElementById('legmin').textContent='0';
  document.getElementById('legmax').textContent=(vmax*3.6).toFixed(1);

  // fit
  var lats=pts.map(function(p){return p.lat;}), lons=pts.map(function(p){return p.lon;});
  map.fitBounds([[Math.min.apply(null,lats),Math.min.apply(null,lons)],
                 [Math.max.apply(null,lats),Math.max.apply(null,lons)]],
                {padding:[40,40]});

  clearTrack();
  updatePanel(0);
  document.getElementById('playBtn').disabled=false;
  document.getElementById('restartBtn').disabled=false;
  document.getElementById('hint').textContent=name+' — '+pts.length+' points loaded';

  play(); // auto-start
}
</script>
</body>
</html>
