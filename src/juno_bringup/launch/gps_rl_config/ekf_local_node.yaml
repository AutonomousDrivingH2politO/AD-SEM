ekf_local_node:

  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1

    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: zed_camera_link
    world_frame: odom

    odom0: /zed/zed_node/odom # Odometry topic (by default zed odomery, could be changed to rtab etc)
    odom0_config: [true,  true,  false,   # x, y, z
                   false, false, false,    # roll, pitch, yaw
                   true,  true,  false,   # vx, vy, vz
                   false, false, false,    # vroll, vpitch, vyaw
                   false, false, false]   # ax, ay, az
    odom0_differential: false
    odom0_relative: false

   
    imu0: /zed/zed_node/imu/data # IMU topic (by default zed imu)
    imu0_config: [false, false, false,   # x, y, z
                  false, false, true,    # roll, pitch, yaw 
                  false, false, false,   # vx, vy, vz
                  false, false, true,    # vroll, vpitch, vyaw 
                  false, false, false]   # ax, ay, az  (can enable later if needed)
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true # ZED documentation specifies that the imu data includes gravity

    use_control: false
    debug: false # Enable in case of debug
    print_diagnostics: true