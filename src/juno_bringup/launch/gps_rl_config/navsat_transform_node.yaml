navsat_transform_node:
  ros__parameters:
    frequency: 30.0
    delay: 0.05

    base_link_frame: base_link # maybe delete since its useless
    odom_frame: odom
    map_frame: map


    magnetic_declination_radians: 0.058 # depends on your location and date; might be adjusted https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml#declination
    yaw_offset: 1.5707963   # pi/2 to convert from NED to ENU
    use_odometry_yaw: false # use IMU yaw (in case it is noisy, it can be set to odometry; therefore to true)


    zero_altitude: true


    publish_filtered_gps: true          # can enable later if you want /gps/filtered, odometry/gps already published for ekf_global
    broadcast_utm_transform: true
    broadcast_utm_transform_as_parent_frame: false
    wait_for_datum: false
    transform_timeout: 0.01
