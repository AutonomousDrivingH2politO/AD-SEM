ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: false

    map_frame: map
    odom_frame: odom
    base_link_frame: zed_camera_link
    world_frame: odom

    odom0: /zed/zed_node/odom
    odom0_config: [true, true, true,
                   true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /zed/zed_node/imu/data
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: true

    use_control: false
    debug: true
    print_diagnostics: true
