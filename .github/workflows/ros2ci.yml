name: ROS 2 Buildability & Unit Tests

on:
  push:
    branches:
      - dev
      - pid-steering
  pull_request:
    branches:
      - dev
      - main

jobs:
  check-build-test:
    name: Check Dependencies, Build, and Test
    runs-on: ubuntu-22.04
    # Using the official ROS 2 Humble container gives us a clean, pre-configured environment
    container:
      image: osrf/ros:humble-desktop

    steps:
      # 1. Check out the repository into a 'src' directory (required by colcon/rosdep)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src/AD-SEM

      # 2. Parse package.xml files and check dependencies
      - name: Parse XMLs & Check Dependencies
        run: |
          sudo apt-get update
          rosdep update
          rosdep install --from-paths src/AD-SEM/src --ignore-src -y --rosdistro humble

      - name: Build Workspace
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --symlink-install \
            --base-paths src/AD-SEM/src \
            --event-handlers console_direct+
      
      - name: Run Unit Tests
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test \
            --base-paths src/AD-SEM/src \
            --packages-select shared_objects ad_juno \
            --pytest-args -v \
            --event-handlers console_direct+
          colcon test-result --all --verbose
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-test-results
          path: build/*/test_results/**/*.xml
